name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: i18n key check
        run: npm run i18n:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_APP_ENV: ci
          VITE_API_BASE_URL: https://localhost:7248/api/
          VITE_PAYABLE_NOTES_ID: 00000000-0000-0000-0000-000000000000
          VITE_RECEIVABLE_NOTES_ID: 00000000-0000-0000-0000-000000000000
